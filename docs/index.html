<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guia e instalador comunitário do LionClaw 3.8.0 no Omarchy: requisitos, acesso GitHub, Node, Electron, validação e menu.">
  <meta name="color-scheme" content="light">
  <title>LionClaw no Omarchy — guia de instalação</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Pular para as instruções</a>
  <header class="topbar">
    <a class="wordmark" href="#overview">LionClaw <span>/</span> Omarchy</a>
    <nav aria-label="Links principais"><a class="active" href="#overview">Guia</a><a href="https://github.com/aiob3/lionclaw-omarchy" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a></nav>
    <button class="mobile-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar">Etapas</button>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <div class="side-heading"><h2>Roteiro de instalação</h2><p>13 etapas · acompanhe no seu ritmo</p></div>
      <nav id="steps-nav" aria-label="Etapas da instalação"></nav>
      <div class="progress"><progress id="progress" max="13" value="0" aria-label="Etapas revisadas manualmente"></progress><p id="progress-label">0 de 13 etapas revisadas</p><button class="text-button" id="reset-progress">Limpar marcações</button><small>Seu acompanhamento local. Não atesta a instalação.</small></div>
    </aside>
    <main id="content" tabindex="-1"><p>Carregando o roteiro…</p><noscript>Ative JavaScript para navegar pelas etapas ou leia o <a href="https://github.com/aiob3/lionclaw-omarchy/blob/main/README.md">guia no repositório</a>.</noscript></main>
  </div>
  <div class="toast" role="status" id="toast" aria-live="polite"></div>
  <div id="print-content"></div>
</body>
</html>
